name: Lint

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Every step gates: the style CONTRIBUTING.md describes is the style CI
# enforces. Run `make format` then `make lint` locally before pushing.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pinned (same as the Makefile's LINTERS) so a new black/isort
        # release cannot turn the workflow red on unchanged code.
        pip install black==26.10.0 isort==9.0.2 flake8==7.4.1 mypy==2.4.0

    - name: Check code formatting with Black
      run: black --check --diff words2num2 tests

    - name: Check import sorting with isort
      run: isort --check-only --diff words2num2 tests

    - name: Lint with flake8
      # Settings (max-line-length, ignores) come from .flake8.
      run: flake8 words2num2 tests --count --show-source --statistics

    - name: Type checking with mypy
      # words2num2/_rust.pyi types the compiled extension, so mypy does not
      # need it built.
      run: mypy words2num2
