# Auto-publish to the AUR (Arch User Repository) when a new tag lands on PyPI.
# Triggers on tag push to v* OR via workflow_dispatch.
#
# Requires repo secret AUR_SSH_PRIVATE_KEY (the private key whose public
# half is registered on the maintainer's AUR account).
name: Publish AUR package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to push to AUR (e.g., 0.2.2)'
        required: true
        type: string

jobs:
  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Inputs and step outputs reach the shell through env, never by
      # ${{ }} substitution into the script, and the version must be a
      # plain X.Y.Z: it is spliced into URLs, sed and a commit (#854).
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VER="$INPUT_VERSION"
          else
            VER="${GITHUB_REF#refs/tags/v}"
          fi
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be X.Y.Z, got: $VER"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI sdist to be live
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          # auto-release dispatches this alongside release.yml, which needs
          # the wheel builds and tests to finish first: wait up to an hour,
          # and fail (rather than hash an error page) if it never appears.
          for i in $(seq 1 360); do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" \
              "https://files.pythonhosted.org/packages/source/w/words2num2/words2num2-${VER}.tar.gz")
            if [ "$CODE" = "200" ]; then
              echo "PyPI sdist for $VER is live."
              exit 0
            fi
            echo "Waiting for PyPI sdist... ($i/360) (got $CODE)"
            sleep 10
          done
          echo "::error::PyPI sdist for $VER never appeared"
          exit 1

      - name: Compute sha256 of PyPI sdist
        id: sha
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          SHA=$(curl -sfL "https://files.pythonhosted.org/packages/source/w/words2num2/words2num2-${VER}.tar.gz" | sha256sum | awk '{print $1}')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "sha256: $SHA"

      - name: Update PKGBUILD + .SRCINFO
        env:
          VER: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::bad sha256: $SHA"; exit 1; }
          cd packaging/aur/python-words2num2
          sed -i -E "s/^pkgver=.*/pkgver=${VER}/" PKGBUILD
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i -E "s/^sha256sums=\(.*\)/sha256sums=('${SHA}')/" PKGBUILD
          # Regenerate .SRCINFO from the patched PKGBUILD.
          # Use a docker container that has makepkg available.
          docker run --rm -v "$PWD":/pkg -w /pkg archlinux:base-devel \
            bash -lc "useradd -m b && chown -R b:b /pkg && su b -c 'makepkg --printsrcinfo > .SRCINFO'"
          cat PKGBUILD
          echo "---"
          cat .SRCINFO

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY secret not set; skipping push."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

          git clone ssh://aur@aur.archlinux.org/python-words2num2.git /tmp/aur || true
          cp packaging/aur/python-words2num2/PKGBUILD /tmp/aur/
          cp packaging/aur/python-words2num2/.SRCINFO /tmp/aur/
          cd /tmp/aur
          git config user.email "jlqueguiner@gladia.io"
          git config user.name "Jean-Louis Queguiner"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No AUR changes."
            exit 0
          fi
          git commit -m "Bump to ${VER}"
          git push origin master
