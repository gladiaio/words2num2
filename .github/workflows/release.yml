name: Release

# Builds per-platform wheels with maturin and publishes them:
#   * wheels + sdist -> PyPI (trusted publishing / OIDC)
#   * wheels + sdist -> GitHub Release
# words2num2 is a single-variant package: the compiled core embeds
# num2words2-core natively (no lingua-rs models), so each wheel is ~2-4 MB.
# Triggered by pushing a version tag, e.g. `v0.3.0`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v), e.g. 0.3.0"
        required: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            ver="$INPUT_VERSION"
          else
            ver="${GITHUB_REF_NAME#v}"
          fi
          # The wheel's metadata comes from pyproject (rewritten below) but
          # `words2num2.__version__` and `words2num2 --version` read the static
          # _version.py, which maturin does not regenerate. Refuse to build a
          # release whose three versions disagree instead of shipping a wheel
          # that misreports itself.
          py=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          pkg=$(python3 -c 'import runpy; print(runpy.run_path("words2num2/_version.py")["__version__"])')
          if [ "$ver" != "$py" ] || [ "$ver" != "$pkg" ]; then
            echo "::error::release $ver, but pyproject.toml says $py and words2num2/_version.py says $pkg (checked out at $GITHUB_REF_NAME): bump both and tag that commit"
            exit 1
          fi
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $ver"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  build:
    name: wheel · ${{ matrix.platform.target }}
    needs: version
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: macos-14,       target: aarch64-apple-darwin }
          # Cross-compile the Intel wheel on the Apple-Silicon runner:
          # GitHub's macos-13 (Intel) pool is deprecated and queues for hours,
          # which stalled the whole Release (publish needs every build job).
          - { os: macos-14,       target: x86_64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  manylinux: auto }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, manylinux: auto }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set version in pyproject
        shell: bash
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          python - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("pyproject.toml"); s = p.read_text()
          s = re.sub(r'(?m)^version = ".*"$',
                     'version = "%s"' % os.environ["VER"], s, count=1)
          p.write_text(s)
          PY

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || '' }}
          args: --release --out dist
          sccache: "true"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set version in pyproject
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          python - <<'PY'
          import os, re, pathlib
          p = pathlib.Path("pyproject.toml"); s = p.read_text()
          s = re.sub(r'(?m)^version = ".*"$',
                     'version = "%s"' % os.environ["VER"], s, count=1)
          p.write_text(s)
          PY
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # Install each built wheel (never the source tree) and run the test suite
  # against it before anything is published. The two cross-compiled wheels
  # (x86_64-apple-darwin built on arm64, aarch64-linux built on x86_64) cannot
  # be imported on these hosted runners, so they are not exercised here; every
  # native wheel and the sdist are.
  test-wheels:
    name: test wheel · ${{ matrix.platform.target }} · py${{ matrix.python }}
    needs: [version, build]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: macos-14,       target: aarch64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
        # abi3: one wheel for every CPython >= 3.10; test both ends.
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist
      - name: Install the wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest num2words2
          python -m pip install --only-binary :all: --no-index --find-links dist words2num2
      - name: Run the test suite against the installed wheel
        shell: bash
        env:
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Run from a copy of tests/ outside the checkout: from the repo root
          # the source words2num2/ (which has no compiled _rust) would shadow
          # the installed wheel.
          cp -r tests REFERENCE.md "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os, words2num2
          print("testing", words2num2.__file__, words2num2.__version__)
          assert words2num2.__version__ == os.environ["VER"], words2num2.__version__
          PY
          python -m pytest tests -q

  test-sdist:
    name: test sdist (build from source)
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdist
          path: dist
      - name: Build and install from the sdist, run the tests
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest num2words2
          python -m pip install dist/*.tar.gz
          cp -r tests REFERENCE.md "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          python -m pytest tests -q

  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish wheels + sdist to PyPI
    needs: [build, sdist, test-wheels, test-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/words2num2/
    permissions:
      id-token: write   # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  # ---------------------------------------------------------------------------
  github-release:
    name: Attach all wheels to the GitHub Release
    needs: [build, sdist, test-wheels, test-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release + upload assets
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          body: |
            Automated release built by maturin.

            `words2num2` is the Rust-powered inverse of `num2words2`: it parses
            spoken-form numbers back to numeric values across 100+ languages.
            Wheels embed the conversion core natively (~2-4 MB, no external
            model files) and the package has no runtime dependencies.

            ```bash
            pip install words2num2
            ```
