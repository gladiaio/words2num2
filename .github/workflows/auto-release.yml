name: Auto release

# Releases the version main declares, so PyPI never lags behind main again
# (0.3.4 sat unreleased on main while PyPI still served 0.3.3).
#
# On every push to main that touches the version (pyproject.toml or
# words2num2/_version.py), and on a manual run: when the version main declares
# is not on PyPI, it checks that _version.py agrees, tags HEAD `v<version>`
# (unless that tag already exists) and dispatches release.yml (PyPI + GitHub
# Release), crates.yml and aur-publish.yml on that tag. A tag pushed with
# GITHUB_TOKEN does not trigger the tag workflows itself, so each runs exactly
# once, from the dispatch.
#
# PyPI is the source of truth for "released", not the tag: a release that
# fails after tagging (0.3.4: two wheel jobs never got a runner) left the tag
# behind and was never retried. Now a tagged-but-unpublished version is
# re-dispatched on its existing tag, by the next version-touching push or a
# manual "Run workflow". Merges that do not bump the version are no-ops.

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - words2num2/_version.py
      - .github/workflows/auto-release.yml
  workflow_dispatch:

permissions:
  contents: write   # push the tag
  actions: write    # dispatch release.yml, crates.yml and aur-publish.yml

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and release the declared version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: v
        run: |
          set -euo pipefail
          ver=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          pkg=$(python3 -c 'import runpy; print(runpy.run_path("words2num2/_version.py")["__version__"])')
          if [ "$ver" != "$pkg" ]; then
            echo "::error::pyproject.toml says $ver but words2num2/_version.py says $pkg: bump both"
            exit 1
          fi
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/words2num2/$ver/json")
          if [ "$code" = "200" ]; then
            echo "$ver is already on PyPI: nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "404" ]; then
            # A PyPI outage must not be read as "unpublished" (that would
            # re-dispatch a release) nor as "published" (that would skip one).
            echo "::error::PyPI answered HTTP $code for $ver: cannot tell whether it is released"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            tagged=$(git rev-list -n 1 "v$ver")
            echo "v$ver is tagged ($tagged) but $ver is not on PyPI: re-dispatching the release on the existing tag."
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag v${{ steps.v.outputs.version }}
        if: steps.v.outputs.release == 'true' && steps.v.outputs.tagged != 'true'
        env:
          VER: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VER" -m "words2num2 $VER"
          git push origin "v$VER"

      - name: Dispatch the release workflows on the tag
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          # On a retry, do not stack a second release on one still running.
          busy=$(gh run list --workflow release.yml --branch "v$VER" --limit 20 \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != "0" ]; then
            echo "A release.yml run for v$VER is still in progress: not dispatching another."
            exit 0
          fi
          gh workflow run release.yml --ref "v$VER" -f version="$VER"
          gh workflow run crates.yml --ref "v$VER"
          # aur-publish waits for the PyPI sdist itself, so it can start now.
          gh workflow run aur-publish.yml --ref "v$VER" -f version="$VER"
          echo "Release of $VER dispatched: https://github.com/$GITHUB_REPOSITORY/actions/workflows/release.yml"
