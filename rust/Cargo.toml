[workspace]
members = ["words2num2-core", "words2num2-py"]
resolver = "2"

[workspace.package]
version = "0.2.7"
edition = "2021"
# The oldest rustc words2num2-core builds with (Option::is_none_or, 1.82;
# #919); words2num2-py sets its own (pyo3).
rust-version = "1.82"
license = "LGPL-2.1-only"
repository = "https://github.com/gladiaio/words2num2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
