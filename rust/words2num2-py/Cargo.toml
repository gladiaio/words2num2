[package]
name = "words2num2-py"
version.workspace = true
edition.workspace = true
# pyo3 0.28+ needs rustc 1.83 (#1267 audit).
rust-version = "1.83"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
words2num2-core = { path = "../words2num2-core" }
num-bigint = "0.4"
bigdecimal = "0.4"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38", "num-bigint"] }
